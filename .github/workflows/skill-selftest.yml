name: Skill self-tests

on:
  push:
    paths:
      - "skills/**"
      - ".github/workflows/skill-selftest.yml"
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skill-selftest.yml"

jobs:
  test-n8n-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile laboratory scripts
        run: python -m py_compile skills/test-n8n-workflow/scripts/*.py
      - name: Run laboratory self-test
        working-directory: skills/test-n8n-workflow/scripts
        run: python selftest.py
      - name: Validate laboratory JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("skills/test-n8n-workflow/assets").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

  build-n8n-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile build-harness scripts
        run: python -m py_compile skills/build-n8n-workflow/scripts/*.py
      - name: Run build-harness self-test
        working-directory: skills/build-n8n-workflow/scripts
        run: python selftest.py
      - name: Validate build JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("skills/build-n8n-workflow/assets").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

  review-n8n-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile review-harness scripts
        run: python -m py_compile skills/review-n8n-change/scripts/*.py
      - name: Run review-harness self-test
        working-directory: skills/review-n8n-change/scripts
        run: python selftest.py
      - name: Validate review JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("skills/review-n8n-change/assets").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

  release-n8n-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile release-controller scripts
        run: python -m py_compile skills/release-n8n-change/scripts/*.py
      - name: Run release-controller self-test
        working-directory: skills/release-n8n-change/scripts
        run: python selftest.py
      - name: Validate release JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("skills/release-n8n-change/assets").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

  improve-engineering-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile harness-improvement scripts
        run: python -m py_compile skills/improve-engineering-harness/scripts/*.py
      - name: Run harness-improvement self-test
        working-directory: skills/improve-engineering-harness/scripts
        run: python selftest.py
      - name: Validate harness JSON assets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path("skills/improve-engineering-harness/assets").glob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY
      - name: Audit Skill description overlap
        run: python skills/improve-engineering-harness/scripts/detect_skill_overlap.py skills --threshold 0.45
